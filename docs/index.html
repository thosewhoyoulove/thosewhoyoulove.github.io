<!DOCTYPE html>
<html lang="en">

        <meta charset="UTF-8" />

        <meta property="og:description" content="前端面试知识库：高频基础、框架原理、工程化、性能优化与项目表达。" />
        <meta property="og:url" content="https://thosewhoyoulove.github.io/" />
        <meta property="og:type" content="website" />
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
        <link rel="stylesheet" href="/assets/css/vue.css" />
        <style>
            /* 当前激活菜单项高亮 */
            .sidebar-nav li a.active-link {
                color: #42b983 !important;
                font-weight: 600 !important;
                border-right: 3px solid #42b983;
                padding-right: 8px;
            }
        </style>
        <script>
            var _hmt = _hmt || [];
            (function () {
                var hm = document.createElement("script");
                hm.src = "https://hm.baidu.com/hm.js?b3354307876925c625a24bb138d2177c";
                var s = document.getElementsByTagName("script")[0];
                s.parentNode.insertBefore(hm, s);
            })();
        </script>
    </head>

    <body>
        <div id="app"></div>
        <script>
            window.$docsify = {
                name: "omen's interview notes", //网站名称
                repo: "https://github.com/thosewhoyoulove", //GitHub 仓库链接
                auto2top: true, //切换页面后自动跳转到页面顶部
                coverpage: true, //启用封面页
                loadSidebar: true, //加载侧边栏
                maxLevel: 3, //最大支持的标题级别
                subMaxLevel: 1, //侧边栏显示的目录层级
                search: {
                    paths: "auto", //搜索路径
                    placeholder: "🔍 Type to search ", //搜索框提示
                    noData: "😞 No Results! ", //没有结果时的提示
                    depth: 6, //搜索深度
                },
                pagination: {
                    previousText: "PREVIOUS", //上一页
                    nextText: "NEXT", //下一页
                    crossChapter: true, //跨章节
                },
                alias: {
                    "/.*/_sidebar.md": "/_sidebar.md", //解决侧边栏路径404问题
                },

                plugins: [
                    // 侧边栏高亮（URL decode 归一化匹配，解决中文空格编码不一致问题）
                    function (hook, vm) {
                        hook.doneEach(function () {
                            var sidebar = document.querySelector('.sidebar-nav');
                            if (!sidebar) return;

                            var currentPath = decodeURIComponent(location.hash.replace('#/', '/'));

                            var allLinks = sidebar.querySelectorAll('a');
                            allLinks.forEach(function (a) {
                                a.classList.remove('active-link');
                                var href = decodeURIComponent(a.getAttribute('href') || '').replace('#/', '/');
                                if (href === currentPath) {
                                    a.classList.add('active-link');
                                }
                            });
                        });
                    },
                ],
            };
        </script>

        <script src="/assets/js/docsify.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js"></script>
        <script src="/assets/js/docsify-pagination.min.js"></script>
        <script src="/assets/js/zoom-image.js"></script>
        <script src="/assets/js/prism-bash.js"></script>
        <script src="/assets/js/prism-java.min.js"></script>
    </body>
</html>
